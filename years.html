<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Life in Years - Interactive</title>
  <meta name="description" content="Enter your date of birth, to see your life in years. Based on the post by Tim Urban, from Wait by Why.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="years-favicon.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
  <link rel="stylesheet" href="your-life.css">
</head>
<body>
  <div class="title-box">
    <div class="title-left">
      <h1 class="title">Your Life in <label for="unitbox" class="unitbox-label visuallyhidden">Years</label></h1>
      <select name="unitbox" class="unitbox" id="unitbox" required>
        <option value="years" selected>Years</option>
        <option value="months">Months</option>
        <option value="weeks">Weeks</option>
      </select>
    </div>
    <div class="quote-box" aria-live="polite">
      <button type="button" class="quote-refresh" id="quote-refresh">Update</button>
      <p class="quote-text" id="quote-text"></p>
      <p class="quote-author" id="quote-author"></p>
    </div>
  </div>
  <form class="dob" action="#">
    <p class="instruction"><span class="print-hide">Enter your </span>Date of Birth</p>
    <label for="month" class="visuallyhidden">Month</label>
    <select name="month" class="month" id="month" required>
      <option value="0">January</option>
      <option value="1">February</option>
      <option value="2">March</option>
      <option value="3">April</option>
      <option value="4">May</option>
      <option value="5">June</option>
      <option value="6">July</option>
      <option value="7">August</option>
      <option value="8">September</option>
      <option value="9">October</option>
      <option value="10">November</option>
      <option value="11">December</option>
    </select>
    <label for="day" class="visuallyhidden">Day</label>
    <input type="text" class="day" id="day" placeholder="31" pattern="\d{0,2}" required/>
    <label for="year" class="visuallyhidden">Year</label>
    <input type="text" class="year" id="year" placeholder="1999" pattern="\d{4}" required/>
  </form>
  <ol class="chart years group">
    <div class="x-axis">
      <label class="axis-label axis-label-x">Years<img src="images/arrow-right.svg" class="axis-arrow axis-arrow-x"/></label>
    </div>
    <div class="y-axis">
      <label class="axis-label axis-label-y"><img src="images/arrow-left.svg" class="axis-arrow axis-arrow-y"/>Age</label>
    </div>
    <div class="life-tracker" aria-live="polite">
      <div class="tracker-value"><span id="life-count">0</span> <span id="life-unit">years</span> / <span id="life-total">0</span></div>
      <div class="tracker-sub" id="life-sub">lived so far</div>
      <div class="tracker-percent"><span id="life-percent">0</span>% of life gone</div>
      <button type="button" class="note-toggle" id="note-toggle">Add note</button>
    </div>
    <aside class="note-panel is-hidden" id="note-panel">
      <div class="note-header">
        <span class="note-title">Note</span>
        <button type="button" class="note-close" id="note-close">Close</button>
      </div>
      <textarea id="note-text" class="note-text" rows="3" placeholder="Write a note..."></textarea>
    </aside>
